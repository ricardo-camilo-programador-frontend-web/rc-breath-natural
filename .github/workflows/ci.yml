name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    name: Validar Linting e Formatacao
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Executar Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Testes
        run: pnpm run test

  build:
    name: Build do Projeto
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SITE_URL: "https://breath-natural-nextjs-chronicles.netlify.app"
      NEXT_PUBLIC_API_URL: "http://localhost:3000"
      NEXT_PUBLIC_PORTFOLIO_URL: "https://persona-nextjs-chronicles-part-2.netlify.app"
      NEXT_PUBLIC_GITHUB_URL: "https://github.com/ricardo-camilo-programador-frontend-web"
      NEXT_PUBLIC_LINKEDIN_URL: "https://www.linkedin.com/in/ricardo-camilo-programador-frontend-web-developer"
      NEXT_PUBLIC_X_URL: "https://x.com/Ricardo50993066"
      NEXT_PUBLIC_INSTAGRAM_URL: ""
      NEXT_PUBLIC_YOUTUBE_URL: ""
      NEXT_PUBLIC_FACEBOOK_URL: ""
      NEXT_PUBLIC_99FREELAS_URL: ""
      NEXT_PUBLIC_WORKANA_URL: ""
      NEXT_PUBLIC_BUYMEACOFFEE_URL: ""
      NEXT_PUBLIC_FIGMA_URL: ""
      NEXT_PUBLIC_CONTACT_EMAIL: ""
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ""
      NEXT_PUBLIC_GTM_ID: ""
      NEXT_PUBLIC_COUNTER_DEV_ID: ""
      NEXT_PUBLIC_LIVE_DEMO_VIDEO_URL: ""
      TREFLE_API_KEY: ""
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Build do projeto
        run: pnpm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-dist
          path: .next/
          retention-days: 7

  security:
    name: Auditoria de Seguranca
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Auditoria de vulnerabilidades
        shell: bash
        run: |
          set -o pipefail
          LOG_FILE="$(mktemp)"

          pnpm audit --audit-level moderate 2>&1 | tee "$LOG_FILE"
          status=${PIPESTATUS[0]}

          if [ "$status" -eq 0 ]; then
            exit 0
          fi

          if grep -q "ERR_PNPM_AUDIT_BAD_RESPONSE" "$LOG_FILE" && grep -Eq "responded with 5[0-9]{2}([^0-9]|$)|error \\(5[0-9]{2}\\)" "$LOG_FILE"; then
            echo "::warning::pnpm audit falhou por erro 5xx do endpoint de auditoria da npm."
            exit 0
          fi

          exit "$status"

  # Sonar duplicado do workflow sonarqube.yml; no self-hosted usava /opt/sonar-scanner.
  # Mantido como soft-check via ubuntu + docker; falha de host não bloqueia a PR.
  sonar:
    name: Analise SonarQube
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Run SonarScanner
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          if [ -z "$SONAR_TOKEN" ] || [ -z "$SONAR_HOST_URL" ]; then
            echo "::warning::SONAR_TOKEN/SONAR_HOST_URL ausentes; pulando Sonar no CI."
            exit 0
          fi
          if ! curl -f -s --max-time 10 "$SONAR_HOST_URL/api/system/status" >/dev/null; then
            echo "::warning::SonarQube inacessível em $SONAR_HOST_URL; pulando."
            exit 0
          fi
          docker run --rm \
            -v "$PWD:/usr/src" \
            -w /usr/src \
            -e SONAR_TOKEN="$SONAR_TOKEN" \
            sonarsource/sonar-scanner-cli:latest \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.host.url="$SONAR_HOST_URL"

  deploy:
    name: Deploy Netlify
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Build do projeto
        run: pnpm run build

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx netlify deploy --prod --dir=.next
